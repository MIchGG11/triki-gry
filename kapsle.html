<!doctype html>
<html lang="pl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kapsle">
<title>Kapsle</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#e4f3e8;--ink:#0d3b2a;--cap:#1f9d55;--cap2:#0f6b38;--gold:#f2b705;--card:#fff;--mute:#4f7564;--r3:#c9e8d3;--r2:#9fd6b4;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e2a1f;--ink:#e3f5e9;--card:#16402f;--mute:#9cc7b0;--r3:#1d4f3b;--r2:#27694e}}
:root[data-theme="dark"]{--bg:#0e2a1f;--ink:#e3f5e9;--card:#16402f;--mute:#9cc7b0;--r3:#1d4f3b;--r2:#27694e}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Baloo 2',system-ui,-apple-system,sans-serif;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
.cap{border-radius:50%;background:repeating-conic-gradient(var(--cap2) 0 9deg,var(--cap) 9deg 18deg);position:relative;isolation:isolate;border:0;color:#fff;font:800 30px 'Baloo 2',system-ui,sans-serif;padding:0;flex:none}
.cap::before{content:"";position:absolute;inset:10%;border-radius:50%;background:radial-gradient(circle at 35% 30%,#58d98f,var(--cap) 60%,var(--cap2));z-index:-1}
.cap.s{width:60px;height:60px}
.bigcap{width:min(64vw,260px);height:min(64vw,260px);transition:transform .07s}
.bigcap.press{transform:scale(.9)}
#menu{padding:28px 20px;max-width:520px;margin:0 auto}
h1{font-size:54px;line-height:1;margin:8px 0 6px;font-weight:800}
.sub{color:var(--mute);margin:0 0 24px;font-size:17px;line-height:1.35}
.card{display:flex;gap:16px;align-items:center;width:100%;text-align:left;background:var(--card);color:var(--ink);border:0;border-radius:22px;padding:14px 16px;margin-bottom:12px;font-family:inherit}
.card:active{transform:scale(.98)}
.conn{font:800 17px 'Baloo 2',system-ui,sans-serif;background:var(--cap);color:#fff;border:0;border-radius:14px;padding:6px 18px;margin:8px 0}
.flash{outline:4px solid var(--gold)}
.row{display:flex;gap:8px;flex-wrap:wrap}.conn.ghost{background:var(--bg);color:var(--ink)}.dbg{display:block;font-size:12px;word-break:break-all}
.card b{display:block;font-size:22px}
.card small{display:block;color:var(--mute);font-size:15px;line-height:1.25}
.card em{display:block;font-style:normal;font-size:14px;color:var(--cap);font-weight:800;margin-top:2px}
#game{display:flex;flex-direction:column;height:100%}
.bar{display:flex;align-items:center;gap:12px;padding:10px 16px}
.bar button{font:800 16px 'Baloo 2',system-ui,sans-serif;background:var(--card);color:var(--ink);border:0;border-radius:14px;padding:6px 14px}
.bar b{font-size:20px}
#hud{margin-left:auto;font-weight:800;color:var(--cap)}
#stage{flex:1;min-height:0;position:relative;touch-action:none}
#stage canvas{display:block;touch-action:none}
.track{position:absolute;left:8%;right:8%;top:38%;height:54px;background:var(--card);border-radius:27px}
.zone{position:absolute;top:0;bottom:0;background:var(--cap);opacity:.85;border-radius:27px}
.mark{position:absolute;top:-8px;width:12px;height:70px;margin-left:-6px;background:var(--gold);border-radius:6px}
.hint{position:absolute;left:0;right:0;bottom:7%;text-align:center;color:var(--mute);padding:0 24px;margin:0;font-size:16px}
.tapwrap{height:100%;display:flex;align-items:center;justify-content:center}
.res{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center}
.res h2{font-size:48px;margin:6px 0 0}
.res p{margin:0 0 12px;color:var(--mute);font-size:18px}
.res .cap{width:96px;height:96px}
.res button{font:800 20px 'Baloo 2',system-ui,sans-serif;background:var(--cap);color:#fff;border:0;border-radius:18px;padding:10px 34px;min-width:200px}
.res button.ghost{background:var(--card);color:var(--ink)}
</style></head>
<body>
<main id="menu">
<h1>Kapsle</h1>
<p class="sub">Trzy gry na pstryknięcie palcem, inspirowane Triki z Żabki. Rekordy zapisują się na tym telefonie.</p>
<div class="card" id="tk" style="display:block"><b>Triki</b><small>Masz prawdziwe Triki? Połącz je i steruj ruchem we wszystkich grach. Połóż Triki nieruchomo i dotknij Wyzeruj.</small><div class="row"><button class="conn" onclick="connectTriki()">Połącz Triki</button><button class="conn ghost" onclick="tkReset()">Wyzeruj</button><button class="conn ghost" onclick="TK.inv*=-1">Odwróć obrót</button><button class="conn ghost" onclick="learnBtn()">Naucz przycisk</button></div><small id="btst">Wymaga przeglądarki Bluefy na iPhonie.</small><small id="btdbg" class="dbg"></small></div>
<button class="card" onclick="play('pstryk')"><span class="cap s"></span><span><b>Pstryk</b><small>Pstryknij kapsel w tarczę. 5 rzutów.</small><em id="b-pstryk"></em></span></button>
<button class="card" onclick="play('stop')"><span class="cap s"></span><span><b>Stop w zieleni</b><small>Zatrzymaj znacznik w zielonej strefie. 8 rund.</small><em id="b-stop"></em></span></button>
<button class="card" onclick="play('tap')"><span class="cap s"></span><span><b>Szybkie tapy</b><small>Ile razy stukniesz kapsel w 10 sekund?</small><em id="b-tap"></em></span></button>
<button class="card" onclick="play('muchy')"><span class="cap s"></span><span><b>Łap muchy</b><small>Kapsel łapie spadające muchy. Przesuwaj palcem albo obracaj Triki. 20 sekund.</small><em id="b-muchy"></em></span></button>
<button class="card" onclick="play('wir')"><span class="cap s"></span><span><b>Wir</b><small>Kręć kapslem jak najdłużej: palcem po kole albo obracając Triki. 10 sekund.</small><em id="b-wir"></em></span></button>
</main>
<section id="game" hidden>
<div class="bar"><button onclick="home()">Menu</button><b id="title"></b><span id="hud"></span></div>
<div id="stage"></div>
</section>
<script>
const $=s=>document.querySelector(s);
let best={};try{best=JSON.parse(localStorage.getItem('kapsle')||'{}')}catch(e){}
function saveBest(g,s){const nb=s>(best[g]||0);if(nb){best[g]=s;try{localStorage.setItem('kapsle',JSON.stringify(best))}catch(e){}}return nb}
let raf=0,cleanup=()=>{},cur='';
const menu=$('#menu'),game=$('#game'),stage=$('#stage'),hud=$('#hud'),title=$('#title');
const NAMES={pstryk:'Pstryk',stop:'Stop w zieleni',tap:'Szybkie tapy',muchy:'Łap muchy',wir:'Wir'};
function renderBest(){for(const g in NAMES){$('#b-'+g).textContent=best[g]!==undefined?'Rekord: '+best[g]:'Jeszcze bez rekordu'}}
function stopAll(){cleanup();cleanup=()=>{};cancelAnimationFrame(raf);jerkCb=null}
function play(g){stopAll();cur=g;menu.hidden=true;game.hidden=false;title.textContent=NAMES[g];stage.innerHTML='';hud.textContent='';({pstryk,stop:stopG,tap:tapG,muchy,wir})[g]()}
function home(){stopAll();game.hidden=true;menu.hidden=false;renderBest()}
function done(score,unit){stopAll();const nb=saveBest(cur,score);hud.textContent='';
stage.innerHTML=`<div class="res"><div class="cap"></div><h2>${score} ${unit}</h2><p>${nb?'Nowy rekord!':'Rekord: '+best[cur]+' '+unit}</p><button onclick="play(cur)">Jeszcze raz</button><button class="ghost" onclick="home()">Menu</button></div>`}
renderBest();

const NUS='6e400001-b5a3-f393-e0a9-e50e24dcca9e',RXC='6e400002-b5a3-f393-e0a9-e50e24dcca9e',TXC='6e400003-b5a3-f393-e0a9-e50e24dcca9e';
let jerkCb=null,skip=0,lastJerk=0,lastUi=0;
const TK={on:false,ref:null,e1:null,e2:null,c:null,bias:[0,0,0],twist:0,ang:0,tx:0,ty:0,flip:false,inv:1,sig:null,learn:false,dev:0};
const dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2],nrm=a=>{const l=Math.hypot(a[0],a[1],a[2])||1;return[a[0]/l,a[1]/l,a[2]/l]},crs=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
function tkReset(){TK.ref=null;TK.ang=0;TK.twist=0}
function setRef(a){const u=nrm(a);TK.ref=u;TK.e1=nrm(crs(u,Math.abs(u[0])<.9?[1,0,0]:[0,1,0]));TK.e2=crs(u,TK.e1)}
function press(s){const now=Date.now();if(now-lastJerk<90)return;lastJerk=now;if(jerkCb)jerkCb(s);const t=$('#tk');t.classList.add('flash');setTimeout(()=>t.classList.remove('flash'),120)}
function other(dv){const b=[...new Uint8Array(dv.buffer,dv.byteOffset,dv.byteLength)],h=b.map(x=>x.toString(16).padStart(2,'0')).join(' '),d=$('#btdbg');
if(TK.learn){TK.sig=b.slice(0,2);TK.learn=false;d.textContent='Przycisk zapamiętany: '+h;return}
d.textContent='Inny pakiet: '+h;if(TK.sig&&TK.sig.every((x,i)=>b[i]===x))press(2.5)}
function learnBtn(){const d=$('#btdbg');if(!TK.on){d.textContent='Najpierw połącz Triki.';return}TK.learn=true;d.textContent='Naciśnij przycisk na Triki…';setTimeout(()=>{if(TK.learn){TK.learn=false;d.textContent='Nie wykryłem przycisku. Triki może go nie wysyłać w tym trybie.'}},8000)}
function onFrames(e){const dv=e.target.value;
if(dv.byteLength<14||dv.getUint8(0)!==0x22){other(dv);return}
for(let o=0;o+14<=dv.byteLength;o+=14){if(skip>0){skip--;continue}
const w=[0,1,2].map(i=>dv.getInt16(o+2+i*2,true)/14.286),a=[0,1,2].map(i=>dv.getInt16(o+8+i*2,true)/2048);
const dev=Math.abs(Math.hypot(a[0],a[1],a[2])-1);TK.dev=dev;
const wb=[w[0]-TK.bias[0],w[1]-TK.bias[1],w[2]-TK.bias[2]],still=Math.hypot(wb[0],wb[1],wb[2])<6&&dev<.08;
if(still)for(let i=0;i<3;i++)TK.bias[i]+=wb[i]*.01;
if(!TK.ref){if(still)setRef(a);continue}
const r=dot(wb,TK.ref)*TK.inv;TK.twist+=(r-TK.twist)*.4;TK.ang+=r*Math.PI/180/208;
TK.c=TK.c?TK.c.map((v,i)=>v+(a[i]-v)*.3):a.slice();
const cu=nrm(TK.c);TK.tx=dot(cu,TK.e1);TK.ty=dot(cu,TK.e2);TK.flip=dot(cu,TK.ref)<-.6;
if(dev>1.2)press(dev)}
const now=Date.now();if(now-lastUi>200&&!menu.hidden){lastUi=now;$('#btst').textContent=TK.ref?`Triki połączony · skręt ${Math.round(TK.twist)}°/s · przechył ${Math.round(Math.hypot(TK.tx,TK.ty)*57)}° · siła ${TK.dev.toFixed(1)} g`:'Triki połączony. Połóż go nieruchomo, żeby ustawić zero.'}}
async function connectTriki(){const st=$('#btst');
if(!navigator.bluetooth){st.textContent='Ta przeglądarka nie obsługuje Bluetooth. Otwórz ten link w aplikacji Bluefy.';return}
try{const d=await navigator.bluetooth.requestDevice({acceptAllDevices:true,optionalServices:[NUS]});
st.textContent='Łączenie…';
const s=await d.gatt.connect(),sv=await s.getPrimaryService(NUS),tx=await sv.getCharacteristic(TXC),rx=await sv.getCharacteristic(RXC);
tx.addEventListener('characteristicvaluechanged',onFrames);await tx.startNotifications();
skip=40;tkReset();await rx.writeValue(new Uint8Array([0x20,0x10,0x00,0xD0,0x07,0xD0,0x00,0x03]));TK.on=true;
d.addEventListener('gattserverdisconnected',()=>{TK.on=false;st.textContent='Triki rozłączony. Połącz ponownie.'});
st.textContent='Triki połączony. Poruszaj nim.'}
catch(e){st.textContent='Nie udało się połączyć: '+(e.message||e)}}

function mkCanvas(){const cv=document.createElement('canvas');stage.appendChild(cv);const dpr=devicePixelRatio||1,W=stage.clientWidth,H=stage.clientHeight;
cv.width=W*dpr;cv.height=H*dpr;cv.style.width=W+'px';cv.style.height=H+'px';const c=cv.getContext('2d');c.scale(dpr,dpr);
const cs=getComputedStyle(document.documentElement);return{cv,c,W,H,col:n=>cs.getPropertyValue(n).trim()}}

function muchy(){const{cv,c,W,H,col}=mkCanvas();
let fx=W/2,score=0,t0=0,last=0,fl=[],sp=0;const R=30;
cv.addEventListener('pointerdown',e=>{fx=e.offsetX});
cv.addEventListener('pointermove',e=>{if(e.buttons)fx=e.offsetX});
function frame(ts){const dt=Math.min(40,ts-last||16)/1000;last=ts;if(!t0)t0=ts;const left=20-(ts-t0)/1000;
if(left<=0){done(score,'much');return}
if(TK.on)fx+=TK.twist/90*W*.6*dt;fx=Math.max(R,Math.min(W-R,fx));
sp-=dt;if(sp<=0){sp=.5+Math.random()*.4;fl.push({x:20+Math.random()*(W-40),y:-10,v:110+Math.random()*120+(20-left)*6})}
for(const f of fl){f.y+=f.v*dt;if(Math.abs(f.x-fx)<R+8&&Math.abs(f.y-(H-70))<R+8){f.hit=1;score++}}
fl=fl.filter(f=>!f.hit&&f.y<H+20);
c.clearRect(0,0,W,H);
for(const f of fl){c.beginPath();c.arc(f.x,f.y,9,0,7);c.fillStyle=col('--gold');c.fill()}
c.beginPath();c.arc(fx,H-70,R,0,7);c.fillStyle=col('--cap2');c.fill();c.beginPath();c.arc(fx,H-70,R-5,0,7);c.fillStyle=col('--cap');c.fill();
c.fillStyle='#fff';c.beginPath();c.arc(fx-9,H-78,5,0,7);c.arc(fx+9,H-78,5,0,7);c.fill();
c.fillStyle=col('--mute');c.textAlign='center';c.font="500 15px 'Baloo 2',system-ui,sans-serif";c.fillText(TK.on?'Obracaj Triki, żeby jechać w bok':'Przesuwaj palcem',W/2,H-14);
hud.textContent=`${Math.ceil(left)} s · ${score}`;raf=requestAnimationFrame(frame)}
raf=requestAnimationFrame(frame)}

function wir(){const{cv,c,W,H,col}=mkCanvas();
let deg=0,sg=0,t0=0,last=0,pa=null;
const add=d=>{if(!t0)t0=last||1;deg+=Math.abs(d);sg+=d},ang=e=>Math.atan2(e.offsetY-H/2,e.offsetX-W/2);
cv.addEventListener('pointerdown',e=>{pa=ang(e)});
cv.addEventListener('pointermove',e=>{if(!e.buttons||pa===null)return;const a=ang(e);let d=a-pa;if(d>Math.PI)d-=2*Math.PI;if(d<-Math.PI)d+=2*Math.PI;pa=a;add(d*57.3)});
function frame(ts){const dt=Math.min(40,ts-last||16)/1000;last=ts;
if(TK.on&&Math.abs(TK.twist)>25)add(TK.twist*dt);
const left=t0?10-(ts-t0)/1000:10;if(left<=0){done(Math.round(deg/36)/10,'obr.');return}
c.clearRect(0,0,W,H);const R=Math.min(W,H)*.28;c.save();c.translate(W/2,H/2);c.rotate(sg*Math.PI/180);
c.fillStyle=col('--cap2');for(let i=0;i<12;i++){c.rotate(Math.PI/6);c.fillRect(-7,-R-16,14,24)}
c.beginPath();c.arc(0,0,R,0,7);c.fill();c.beginPath();c.arc(0,0,R-14,0,7);c.fillStyle=col('--cap');c.fill();
c.beginPath();c.arc(0,-R+34,9,0,7);c.fillStyle=col('--gold');c.fill();c.restore();
c.fillStyle=col('--mute');c.textAlign='center';c.font="500 15px 'Baloo 2',system-ui,sans-serif";c.fillText(TK.on?'Obracaj Triki w płaszczyźnie stołu':'Kręć palcem wokół kapsla',W/2,H-14);
hud.textContent=`${Math.max(0,Math.ceil(left))} s · ${(deg/360).toFixed(1)} obr.`;raf=requestAnimationFrame(frame)}
raf=requestAnimationFrame(frame)}

function pstryk(){
const cv=document.createElement('canvas');stage.appendChild(cv);
const dpr=devicePixelRatio||1,W=stage.clientWidth,H=stage.clientHeight;
cv.width=W*dpr;cv.height=H*dpr;cv.style.width=W+'px';cv.style.height=H+'px';
const c=cv.getContext('2d');c.scale(dpr,dpr);
const cs=getComputedStyle(document.documentElement),col=n=>cs.getPropertyValue(n).trim();
const T={x:W/2,y:H*.28},R=24,start={x:W/2,y:H-70};
let p={...start},v={x:0,y:0},throws=0,total=0,state='aim',drag=null,last=0,msg='',tm=0,aim=0;
const upd=()=>hud.textContent=`Rzut ${Math.min(throws+1,5)}/5 · ${total} pkt`;upd();
function disc(x,y,r,f){c.beginPath();c.arc(x,y,r,0,7);c.fillStyle=f;c.fill()}
function draw(){c.clearRect(0,0,W,H);
disc(T.x,T.y,110,col('--r3'));disc(T.x,T.y,70,col('--r2'));disc(T.x,T.y,34,col('--gold'));disc(T.x,T.y,10,col('--cap2'));
disc(p.x,p.y,R,col('--cap2'));disc(p.x,p.y,R-5,col('--cap'));disc(p.x-6,p.y-7,6,'rgba(255,255,255,.35)');
c.textAlign='center';c.fillStyle=col('--mute');c.font="500 16px 'Baloo 2',system-ui,sans-serif";
if(state==='aim'){c.fillText(TK.on?'Obróć Triki, żeby wycelować, i stuknij nim':'Pstryknij kapsel w stronę tarczy',W/2,H-18);if(TK.on){c.strokeStyle=col('--gold');c.lineWidth=4;c.setLineDash([8,8]);c.beginPath();c.moveTo(p.x,p.y);c.lineTo(p.x+Math.sin(aim)*150,p.y-Math.cos(aim)*150);c.stroke();c.setLineDash([])}}
if(msg){c.fillStyle=col('--ink');c.font="800 34px 'Baloo 2',system-ui,sans-serif";c.fillText(msg,W/2,H*.62)}}
function frame(ts){const dt=Math.min(32,ts-last||16)/16.67;last=ts;if(TK.on&&state==='aim')aim=Math.max(-1.2,Math.min(1.2,TK.ang));
if(state==='roll'){p.x+=v.x*dt;p.y+=v.y*dt;
if(p.x<R){p.x=R;v.x*=-.6}if(p.x>W-R){p.x=W-R;v.x*=-.6}if(p.y<R){p.y=R;v.y*=-.6}if(p.y>H-R){p.y=H-R;v.y*=-.6}
const f=Math.pow(.955,dt);v.x*=f;v.y*=f;
if(Math.hypot(v.x,v.y)<.25){const d=Math.hypot(p.x-T.x,p.y-T.y),pts=d<12?100:Math.max(0,Math.round(100-d*.7));
total+=pts;throws++;msg='+'+pts;state='wait';upd();
tm=setTimeout(()=>{msg='';if(throws>=5)done(total,'pkt');else{p={...start};state='aim';upd()}},900)}}
draw();raf=requestAnimationFrame(frame)}
raf=requestAnimationFrame(frame);
jerkCb=s=>{if(state!=='aim')return;const sp=Math.min(24,8+s*3.5);v={x:Math.sin(aim)*sp,y:-Math.cos(aim)*sp};state='roll'};
const pos=e=>{const r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top,t:e.timeStamp}};
cv.addEventListener('pointerdown',e=>{const q=pos(e);if(state==='aim'&&Math.hypot(q.x-p.x,q.y-p.y)<70){drag=[q];cv.setPointerCapture(e.pointerId)}});
cv.addEventListener('pointermove',e=>{if(drag){drag.push(pos(e));if(drag.length>6)drag.shift()}});
cv.addEventListener('pointerup',()=>{if(!drag)return;const a=drag[0],b=drag[drag.length-1],dt=(b.t-a.t)||1;drag=null;
let vx=(b.x-a.x)/dt*16.67,vy=(b.y-a.y)/dt*16.67;const s=Math.hypot(vx,vy);if(s<3)return;
const k=Math.min(1,26/s);v={x:vx*k,y:vy*k};state='roll'});
cleanup=()=>clearTimeout(tm)}

function stopG(){
stage.innerHTML='<div class="track"><div class="zone"></div><div class="mark"></div></div><p class="hint">Dotknij ekranu, gdy znacznik jest w zielonej strefie</p>';
const zn=$('.zone'),mk=$('.mark'),hint=$('.hint');
let round=0,total=0,speed=0,zw=0,zc=0,pos=0,dir=1,wait=false,last=0,tm=0;
function setup(){zw=Math.max(.08,.3-round*.03);zc=zw/2+Math.random()*(1-zw);speed=.7+round*.15;
zn.style.left=(zc-zw/2)*100+'%';zn.style.width=zw*100+'%';hud.textContent=`Runda ${round+1}/8 · ${total} pkt`;hint.textContent='Dotknij ekranu, gdy znacznik jest w zielonej strefie'}
setup();
function frame(ts){const dt=Math.min(40,ts-last||16);last=ts;
if(!wait){pos+=dir*speed*dt/1000;if(pos>1){pos=1;dir=-1}if(pos<0){pos=0;dir=1}}
mk.style.left=pos*100+'%';raf=requestAnimationFrame(frame)}
raf=requestAnimationFrame(frame);
function tap(){if(wait)return;wait=true;const d=Math.abs(pos-zc),h=zw/2;
const pts=d<=h?Math.round(100-d/h*30):Math.max(0,Math.round(60-(d-h)*200));
total+=pts;hint.textContent='+'+pts+' pkt';hud.textContent=`Runda ${round+1}/8 · ${total} pkt`;
tm=setTimeout(()=>{round++;if(round>=8)done(total,'pkt');else{setup();wait=false}},800)}
stage.addEventListener('pointerdown',tap);jerkCb=tap;

function tapG(){
stage.innerHTML='<div class="tapwrap"><button class="cap bigcap" id="tb" aria-label="Kapsel">Tap!</button></div><p class="hint">Stukaj w kapsel przez 10 sekund. Czas startuje od pierwszego tapnięcia.</p>';
let n=0,end=0,started=false,iv=0;const b=$('#tb');hud.textContent='0 tapnięć';
function tick(){const left=Math.max(0,end-Date.now());hud.textContent=`${(left/1000).toFixed(1)} s · ${n}`;if(left<=0){clearInterval(iv);done(n,'tapnięć')}}
function hit(){if(!started){started=true;end=Date.now()+10000;iv=setInterval(tick,100)}
if(Date.now()>=end)return;n++;b.classList.add('press');setTimeout(()=>b.classList.remove('press'),70);tick()}
b.addEventListener('pointerdown',e=>{e.preventDefault();hit()});jerkCb=hit;
cleanup=()=>clearInterval(iv)}
</script>
